org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Kotlin incremental compilation is disabled because it does not work here.
# `compileReleaseKotlin` fails on Windows with "Could not close incremental caches ...
# class-fq-name-to-source.tab", non-deterministically and in a different plugin each time
# (shared_preferences_android, then image_picker_android) — including on a freshly cleaned
# tree. It is a file-handle problem in the Kotlin daemon on Windows, not a code problem: the
# same sources compile once the incremental caches are out of the picture.
#
# The cost is a full Kotlin recompile of the plugin modules each build. That is seconds, and
# only for the Android plugin glue — the Dart is compiled by the Flutter toolchain, not by
# this. A build that cannot complete is worth more than one that is fast when it works.
kotlin.incremental=false
