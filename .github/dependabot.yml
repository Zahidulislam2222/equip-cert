version: 2

# Free on every plan, including public repositories.
#
# Two ecosystems, deliberately different cadences. npm dependencies are where a vulnerable
# transitive package arrives; GitHub Actions are where a compromised action would run with
# repository credentials, so those are worth watching even though they change rarely.

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    # PAUSED 2026-09-28 at the owner's request (no email while the backend is down; DEF-070).
    # Was 0 (paused) 2026-09-28 to 2026-10-01 while the backend was down; resumed 2026-10-01.
    open-pull-requests-limit: 5
    # Security updates always come through individually and are never grouped, regardless of
    # what is written here — grouping only affects routine version bumps, which are far easier
    # to review as one PR than as fifteen.
    groups:
      dev-tooling:
        patterns:
          - '@types/*'
          - 'eslint*'
          - 'typescript'
          - 'esbuild'
        update-types: [minor, patch]
      runtime-minor-patch:
        patterns: ['*']
        exclude-patterns:
          - 'next'
          - 'react'
          - 'react-dom'
          - 'three'
        update-types: [minor, patch]
    ignore:
      # three.js and @types/three are pinned to exact versions on purpose: the hero renderer
      # uses post-processing passes from the examples directory, which is explicitly not
      # covered by the library's semver guarantees. Upgrades here are a deliberate act with a
      # visual check, not a routine bump.
      - dependency-name: 'three'
        update-types: [version-update:semver-minor, version-update:semver-patch]
      - dependency-name: '@types/three'
      # Majors held 2026-11-25 (DEF-075). Recorded here, never as a PR comment (DEF-070).
      # @types/node must track the runtime (Node 22 in CI/Docker), not the newest release.
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
      # lucide-react 1.x renames icons and openai 7.x changes the client API; each needs a
      # deliberate upgrade with the browser-flow suite, not a routine bump.
      - dependency-name: 'lucide-react'
        update-types: [version-update:semver-major]
      - dependency-name: 'openai'
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # Resumed 2026-10-01 (paused 2026-09-28, see npm above).
    open-pull-requests-limit: 3
