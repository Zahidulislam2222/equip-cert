name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.gitignore'
  pull_request:
    branches: [main]
  workflow_dispatch:

# A superseded run proves nothing. Cancel it rather than paying for it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default. No job here writes to the repository.
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Everything that can be decided from the repository alone.
  #
  # Deliberately needs NO secrets, so it also runs on pull requests from forks —
  # where GitHub does not expose secrets at all. A gate that silently skips on
  # exactly the changes that most need reviewing is not a gate.
  # ---------------------------------------------------------------------------
  static:
    name: Static gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Configuration boundary (Rule 12)
        run: npm run test:config

      - name: Plan limits match plans.ts
        run: npm run test:schema

      - name: Kubernetes manifests match deploy.config.json
        run: npm run test:deploy

      - name: Unit tests
        run: npm run test:unit

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      # The build bakes NEXT_PUBLIC_* values into the static export, so this job uses
      # unmistakably fake ones. That is correct here and not a shortcut: this job proves the
      # code COMPILES, and its output is never deployed. Deployment builds its own artifact
      # with real configuration (see deploy/ and Rule 9). Using real secrets here would put
      # them inside a CI artifact for no benefit.
      - name: Build (static export)
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example-ci.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-not-a-real-key
          NEXT_PUBLIC_CONTENTFUL_SPACE_ID: ci-placeholder
          NEXT_PUBLIC_CONTENTFUL_ACCESS_TOKEN: ci-placeholder
          NEXT_PUBLIC_APP_URL: https://example-ci.invalid
        run: npm run build

      - name: Build self-host adapter
        run: npm run build:server

  # ---------------------------------------------------------------------------
  # Everything that can only be decided by asking the real services.
  #
  # This is the class of gate whose absence let DEF-007 (a backend that was not
  # answering), DEF-017 (a public storage bucket) and DEF-020 (a privilege
  # escalation) all coexist in a green build. None of them is visible to a
  # linter, a type checker or a build.
  #
  # Skipped, loudly, when the secrets are not configured. It must never fail
  # open by quietly passing.
  # ---------------------------------------------------------------------------
  live:
    name: Live service gates
    runs-on: ubuntu-latest
    needs: static
    # Two populations get no secrets, and running this job for either only produces noise that
    # looks like a real failure.
    #
    #   1. Fork pull requests — the usual case, and the reason this guard was written.
    #   2. **Dependabot.** DEF-057. Its branches live in *this* repository, so the fork test
    #      above passes, but GitHub deliberately withholds repository secrets from any event
    #      whose actor is `dependabot[bot]` and serves a separate Dependabot secrets store
    #      instead. The job therefore reached "Check required secrets are present" and stopped
    #      there, which is the DEF-001 guard doing its job — the secrets really were absent.
    #      Every Dependabot PR was blocked by a failure that had nothing to do with its diff.
    #
    # What is given up: a dependency bump is not checked against the live backend before merge.
    # That is acceptable and bounded — `push` to `main` runs this job in full, so a bump that
    # breaks the Supabase contract surfaces within one run rather than never. Mirroring eight
    # secrets (including a service-role key) into a second store on a **public** repository is
    # the larger risk, and it is the owner's call, not a workflow default.
    if: >-
      (github.event_name != 'pull_request'
       || github.event.pull_request.head.repo.full_name == github.repository)
      && github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # DEF-001: GitHub substitutes an empty string for a missing secret, so a workflow can go
      # green while doing nothing at all. That is exactly how the keepalive ended up curling an
      # empty URL for weeks while the project it was meant to keep alive was paused. Every job
      # that depends on a secret states which ones, and stops if any is blank.
      - name: Check required secrets are present
        id: secrets
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          NEXT_PUBLIC_CONTENTFUL_SPACE_ID: ${{ secrets.NEXT_PUBLIC_CONTENTFUL_SPACE_ID }}
          NEXT_PUBLIC_CONTENTFUL_ACCESS_TOKEN: ${{ secrets.NEXT_PUBLIC_CONTENTFUL_ACCESS_TOKEN }}
        run: |
          missing=""
          for var in NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY \
                     SUPABASE_SERVICE_ROLE_KEY SUPABASE_ACCESS_TOKEN SUPABASE_PROJECT_REF \
                     NEXT_PUBLIC_CONTENTFUL_SPACE_ID NEXT_PUBLIC_CONTENTFUL_ACCESS_TOKEN; do
            if [ -z "${!var}" ]; then missing="$missing $var"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error title=Live gates cannot run::Missing repository secrets:$missing"
            echo "These gates are the only ones that can detect a dead backend, a public"
            echo "storage bucket, or a privilege escalation. Set them in"
            echo "Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "All required secrets are present."

      - name: Dependencies are reachable (DEF-022)
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_CONTENTFUL_SPACE_ID: ${{ secrets.NEXT_PUBLIC_CONTENTFUL_SPACE_ID }}
          NEXT_PUBLIC_CONTENTFUL_ACCESS_TOKEN: ${{ secrets.NEXT_PUBLIC_CONTENTFUL_ACCESS_TOKEN }}
        run: npm run test:deps

      - name: Generated types match the applied migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: npm run test:types

      - name: Tenant isolation and privilege boundaries (DEF-025)
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run test:rls

      # There is deliberately NO `supabase link` step. DEF-053: `link` calls
      # `GET /v1/projects/{ref}`, and the Management API refuses that one endpoint for a SCOPED
      # access token — while granting every other endpoint these gates need, and while Supabase's
      # own permission panel lists it as granted. Every command below takes
      # `--linked --project-ref "$SUPABASE_PROJECT_REF"` instead, which needs no link file and no
      # refused call. Verified 2026-09-11 against the live project with the scoped token.
      #
      # Do not "simplify" this back to `supabase link` unless the token in
      # SUPABASE_ACCESS_TOKEN is a non-scoped one. It will fail, and the error message it prints
      # blames the token/ref *pair*, which is not what is wrong.

      # A migration that is merged but never applied does nothing, and the failure surfaces
      # later as a missing column at runtime. The reverse — applied but not in the repository —
      # means the schema was changed by hand, which is how DEF-019 lost a whole table.
      #
      # This is the one step that also needs the database password: `migration list` opens a
      # real connection. The password travels through the environment, never as a command-line
      # argument — `npm notice run` echoes the full command line, which is how it ended up in a
      # session transcript once and had to be rotated by hand.
      - name: Migrations are applied and tracked
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          if [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error title=SUPABASE_DB_PASSWORD not set::The migration gate needs a"
            echo "database connection. Set it in Settings > Secrets and variables > Actions."
            exit 1
          fi
          npm run test:migrations

      # Supabase's own linters. They catch the class of thing a human review misses:
      # a table left without RLS, a function with a mutable search_path, a missing index
      # behind a foreign key.
      #
      # Both steps used to grep the CLI's output for `'"name":"..."'` inline here. That pattern
      # only matches compact JSON, which the CLI emits *only when it detects an AI agent in the
      # environment* — on a runner it pretty-prints, the grep matched nothing, and the step went
      # green no matter what the advisors said. DEF-056. The logic lives in a script now, the
      # output shape is pinned with `--output-format json --agent no`, and output it cannot
      # parse is a failure rather than a pass.
      - name: Supabase security advisors
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: npm run test:advisors -- security

      - name: Supabase performance advisors
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: npm run test:advisors -- performance

  # ---------------------------------------------------------------------------
  # The Flutter client — Android.
  #
  # Deliberately NOT path-filtered to `mobile/**`. `mobile/test/schema_contract_test.dart`
  # reads `supabase/migrations/`, and `capture_downscale_test.dart` reads `.env.example`;
  # both are contract tests against files OUTSIDE mobile/. A path filter would skip exactly
  # the run that a migration change most needs.
  #
  # Needs no secrets, so it runs on fork pull requests too. `mobile/lib/src/config/
  # app_config.dart` supplies compile-time defaults for every --dart-define, and the app fails
  # closed at runtime when the Supabase values are blank — so an unconfigured build still
  # proves that it compiles, which is all this job claims.
  # ---------------------------------------------------------------------------
  mobile-android:
    name: Flutter (Android)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned to the version this was developed and verified against. A floating `channel:
      # stable` would silently move the toolchain under a client whose whole test suite
      # asserts library behaviour — DEF-049 and DEF-050 were both found by tests that pin
      # what a dependency actually does, and those tests are only meaningful against a known
      # SDK.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.3
          channel: stable
          cache: true

      - name: Resolve dependencies
        working-directory: mobile
        run: flutter pub get

      # Formatting runs BEFORE analyze, and that order is deliberate. `dart format` splits a
      # long single-line `if (x) return;` across two lines, and only THEN does
      # `curly_braces_in_flow_control_structures` fire on it. So analyze on an unformatted tree
      # answers a different question from analyze on a formatted one: the local tree reported
      # "No issues found!" while seven of these were latent, and they appeared the moment the
      # formatter ran. Checking format first means analyze always sees the canonical text.
      #
      # This step did not exist when Stage 5 was first called done, which is why E2 was never
      # run and 41 files were unformatted. DEF-052.
      - name: Formatting is canonical (E2)
        working-directory: mobile
        run: dart format --output=none --set-exit-if-changed lib test

      # `--fatal-infos` because the project gate is "No issues found!", not "no errors".
      # Without it, `flutter analyze` exits 0 on infos — and an info is what surfaced DEF-048,
      # a security check that had been written and never wired to anything.
      - name: Analyze (zero issues, infos included)
        working-directory: mobile
        run: flutter analyze --fatal-infos

      - name: Unit tests
        working-directory: mobile
        run: flutter test

      # No key.properties exists on a runner and none should. What this proves is that the
      # release build COMPILES; the assertion below proves it did not quietly sign itself with
      # the public debug key, which is what the Flutter scaffold did.
      - name: Build release APK
        working-directory: mobile
        run: flutter build apk --release

      # Asserts the SIGNATURE, not the filename. Verified locally on 2026-09-11: with
      # key.properties removed, Flutter still names the output `app-release.apk` — it just has
      # no signature block at all (`apksigner verify` reports "Missing META-INF/MANIFEST.MF").
      # Checking for an `app-release-unsigned.apk` filename would therefore have passed on a
      # debug-signed APK, which is the exact failure this step exists to catch.
      - name: The unsigned-when-unconfigured guarantee holds
        working-directory: mobile
        run: |
          apk=build/app/outputs/flutter-apk/app-release.apk
          ls -l build/app/outputs/flutter-apk/
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort | tail -1)
          if [ -z "$apksigner" ]; then
            echo "::error title=apksigner not found::Cannot verify the release signature."
            exit 1
          fi

          if "$apksigner" verify --print-certs "$apk"; then
            echo "::error title=Release signing fell back::The release APK IS signed, on a"
            echo "runner that holds no keystore. That means the build found a signing config"
            echo "it should not have — the SDK's debug key is public, and an APK signed with"
            echo "it is installable, distributable and updatable by anyone."
            exit 1
          fi
          echo "Release APK carries no signature, as intended without key.properties."

      # Acceptance criterion C4 is specified as "manifest inspection of the BUILT release
      # manifest", not the source one. The distinction is the point: a merged library manifest
      # can reintroduce cleartext traffic or a debuggable flag that the source file never had.
      - name: Built release manifest is hardened (C4)
        working-directory: mobile
        run: |
          # `packaged_manifests`, specifically: that is the one AGP puts INTO the APK. The
          # other release manifests under intermediates/ (merged_manifest/…AppLinkSettings,
          # processReleaseMainManifest) are earlier stages, and asserting against one of those
          # would be checking a file that never ships.
          manifest=build/app/intermediates/packaged_manifests/release/processReleaseManifestForPackage/AndroidManifest.xml
          if [ ! -f "$manifest" ]; then
            # AGP has moved this path before. Fall back to a search rather than fail on a
            # path change, but never silently accept "no manifest found".
            manifest=$(find build/app/intermediates -path '*packaged_manifests*release*' -name AndroidManifest.xml | head -1)
          fi
          if [ -z "$manifest" ]; then
            echo "::error title=No merged manifest::Could not locate the built release manifest."
            find build/app/intermediates -name AndroidManifest.xml | head -20
            exit 1
          fi
          echo "Inspecting $manifest"
          cat "$manifest"

          if grep -q 'android:debuggable="true"' "$manifest"; then
            echo "::error title=Debuggable release::android:debuggable=true survived into the release manifest."
            exit 1
          fi
          if grep -q 'usesCleartextTraffic="true"' "$manifest"; then
            echo "::error title=Cleartext permitted::A merged manifest re-enabled cleartext traffic."
            exit 1
          fi
          if ! grep -q 'networkSecurityConfig' "$manifest"; then
            echo "::error title=No network security config::The release manifest does not reference one."
            exit 1
          fi
          echo "Release manifest: not debuggable, no cleartext, network security config present."

  # ---------------------------------------------------------------------------
  # The Flutter client — iOS.
  #
  # A SEPARATE RUNNER because iOS cannot be built anywhere else. Xcode is macOS-only, so the
  # Windows machine this project is developed on can typecheck and test the Dart but has no
  # way to discover that a CocoaPods dependency does not resolve, that the Xcode project
  # references a missing file, or that a plugin has no iOS implementation. Without this job
  # the iOS half of "Android + iOS client" is an untested claim.
  #
  # `--no-codesign` because signing needs the Apple Developer Program: $99/year, recurring,
  # NOT authorised. This produces a compiled .app that cannot be installed on a device, and no
  # claim beyond "it builds" should be made from it. macOS runner minutes are free on this
  # repository because it is public.
  # ---------------------------------------------------------------------------
  mobile-ios:
    name: Flutter (iOS, unsigned)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.3
          channel: stable
          cache: true

      - name: Resolve dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Build iOS (unsigned)
        working-directory: mobile
        run: flutter build ios --release --no-codesign

      # C5. Checked against the built app bundle rather than the source plist, for the same
      # reason as C4: this is the file that actually ships. `plutil -extract` fails when the
      # key is absent, so a plist that dropped the ATS dictionary entirely fails here too
      # instead of passing on a missing grep match.
      - name: Built Info.plist forbids arbitrary loads (C5)
        working-directory: mobile
        run: |
          plist=build/ios/iphoneos/Runner.app/Info.plist
          ls -l "$plist"

          allows=$(plutil -extract NSAppTransportSecurity.NSAllowsArbitraryLoads raw -o - "$plist")
          echo "NSAllowsArbitraryLoads=$allows"
          if [ "$allows" != "false" ]; then
            echo "::error title=ATS disabled::NSAllowsArbitraryLoads is not false in the built app."
            exit 1
          fi

          # C6: every permission the app can trigger must carry a purpose string, or iOS kills
          # the app the moment the prompt would appear.
          for key in NSCameraUsageDescription NSPhotoLibraryUsageDescription NSLocationWhenInUseUsageDescription; do
            value=$(plutil -extract "$key" raw -o - "$plist")
            if [ -z "$value" ]; then
              echo "::error title=Missing purpose string::$key is absent from the built Info.plist."
              exit 1
            fi
            echo "$key: $value"
          done
