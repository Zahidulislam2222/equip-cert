name: Supabase Keep Alive

# A Supabase free project is PAUSED when it "does not receive sufficient user database activity
# over the past week" (supabase.com/docs/guides/platform/free-project-pausing), and a paused
# project loses its DNS record. This workflow has failed at that job twice.
#
# Version 1 (DEF-001, DEF-007):
#
#   curl -s -o /dev/null -w "%{http_code}" "${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}/rest/v1/" ...
#
#   The secrets were unset, so GitHub substituted empty strings and the URL became "/rest/v1/";
#   curl's exit status and the status code were never checked. A daily green tick on a job that
#   made no request.
#
# Version 2 (DEF-069) fixed all of that and pinged GET /auth/v1/health twice a week, asserting
# HTTP 200 and a GoTrue body. Every assertion was correct and the job was green on 2026-09-14
# and 2026-09-17 — but GoTrue answers that endpoint WITHOUT querying Postgres, so none of it was
# database activity. By 2026-09-21 the project had paused and its host no longer resolved.
#
# Version 3 (this one) reads one row of `plan_limits` through PostgREST, which can only answer
# by running a SELECT, and judges success on the body (see scripts/supabase-keepalive.mjs).
# It runs daily, because the docs describe "a few user requests to the database each day".

on:
  schedule:
    # Daily. GitHub disables scheduled workflows on repositories with no activity for 60 days,
    # so this is a reminder rather than a guarantee — see the note in the final step.
    - cron: '0 6 * * *'
  workflow_dispatch:
  # Never add pull_request: this job holds the service-role key, and a PR trigger would put it
  # within reach of workflow code that has not been reviewed.

permissions:
  contents: read

jobs:
  ping:
    name: Keep the project awake
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # No dependencies to install: the script uses only Node built-ins.
      - name: Query the database
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        # Belt and braces: the script exits 0 only after a verified row, and the step ALSO
        # requires the success line — so a script that exits 0 without querying (the first
        # review found one path that did) still fails here.
        shell: bash
        run: |
          set -euo pipefail
          node scripts/supabase-keepalive.mjs | tee "$RUNNER_TEMP/keepalive.out"
          grep -q '^Database answered:' "$RUNNER_TEMP/keepalive.out"

      - name: Note the residual risk
        run: |
          echo "::notice title=Scheduled workflows expire::GitHub disables cron workflows on a"
          echo "repository with no commits for 60 days. If this project goes quiet for longer,"
          echo "this keepalive stops running and the Supabase project will pause again."
          echo "Re-enable it from the Actions tab, or push any commit."
